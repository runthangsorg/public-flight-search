name: public-flight-digest

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Search without sending email"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-flight-digest
  cancel-in-progress: true

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_FLIGHT_DIGEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out public engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded browser runtime
        run: |
          python -m pip install --disable-pip-version-check -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Search and optionally deliver
        env:
          FLIGHT_SEARCH_CONFIG_JSON: ${{ secrets.FLIGHT_SEARCH_CONFIG_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          FLIGHT_EMAIL_SUBJECT: ${{ secrets.FLIGHT_EMAIL_SUBJECT }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_FLIGHTS_MAX_SEARCHES: "60"
          GOOGLE_FLIGHTS_TOTAL_TIMEOUT_SECONDS: "1800"
          GOOGLE_FLIGHTS_DELAY_SECONDS: "8"
          DEBUG_LOG_PATH: "/tmp/flight-debug.log"
          SCREENSHOTS_DIR: "/tmp/flight-verify"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLIGHT_SEARCH_CONFIG_JSON}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_DRY_RUN}" == "true" ]]; then
            python -m public_flight_search flight-digest --dry-run
          else
            python -m public_flight_search flight-digest
          fi
      - name: Dump debug log
        run: |
          echo "=== FLIGHT DEBUG LOG ==="
          cat /tmp/flight-debug.log 2>/dev/null || echo "(no debug log found)"
          echo "=== SCREENSHOTS ==="
          ls -la /tmp/flight-verify/ 2>/dev/null || echo "(no screenshots)"
        if: always()
      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flight-digest-report
          path: /tmp/flight-verify/*.html
          retention-days: 7
        if: always()
