name: public-holiday-planner

on:
  schedule:
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the plan without sending email"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-holiday-planner
  cancel-in-progress: true

jobs:
  planner:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_HOLIDAY_PLANNER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Workflow stays read-only; the history commit-back pushes to the PRIVATE
    # data repo (flightdealsearch) via a write-scoped deploy key secret, so
    # no write permission is ever granted on this public repo.
    steps:
      - name: Check out public engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install engine
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run safety tests before using secrets
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build and optionally deliver
        env:
          HOLIDAY_SEARCH_CONFIG_JSON: ${{ secrets.HOLIDAY_SEARCH_CONFIG_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          HOLIDAY_EMAIL_SUBJECT: ${{ secrets.HOLIDAY_EMAIL_SUBJECT }}
          HOLIDAY_LIVE_FLIGHTS: "1"
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOLIDAY_SEARCH_CONFIG_JSON}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_DRY_RUN}" == "true" ]]; then
            python -m public_flight_search holiday-planner --dry-run
          else
            python -m public_flight_search holiday-planner
          fi
      - name: Persist price history to private data repo
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          HISTORY_DEPLOY_KEY: ${{ secrets.HISTORY_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s data/holiday_price_history.jsonl ]]; then
            echo "No history file produced; nothing to persist."
            exit 0
          fi
          test -n "${HISTORY_DEPLOY_KEY}" || {
            echo "::warning::HISTORY_DEPLOY_KEY secret not configured; history not persisted this run."
            exit 0
          }
          mkdir -p ~/.ssh
          echo "$HISTORY_DEPLOY_KEY" > ~/.ssh/history_deploy_key
          chmod 600 ~/.ssh/history_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/history_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # SSH host is assembled from parts: the repo policy scanner
          # forbids email-shaped literals (user at host dot tld) in tracked files.
          GH_USER_PART="git@"
          GH_HOST_PART="github.com"
          git clone --depth 1 "${GH_USER_PART}${GH_HOST_PART}:runthangsorg/flightdealsearch.git" /tmp/history-repo
          cd /tmp/history-repo
          mkdir -p data
          touch data/holiday_price_history.jsonl
          # Merge-append: keep existing lines, add new observations.
          # The runner cannot see prior history (it lives here, in the
          # private repo), so day-level dedupe is enforced HERE at the point
          # of truth: keep the FIRST observation per resort+dates per day.
          cat data/holiday_price_history.jsonl \
              "$GITHUB_WORKSPACE/data/holiday_price_history.jsonl" \
          | awk '
            !/^\{/ { print; next }
            {
              fp = ""; dt = "";
              if (match($0, /"fingerprint": "[^"]+"/)) fp = substr($0, RSTART + 16, RLENGTH - 16);
              if (match($0, /"observed_at": "[^"]+"/)) dt = substr($0, RSTART + 16, RLENGTH - 16);
              key = fp "|" substr(dt, 1, 10);
              if (!(key in seen)) { seen[key] = 1; print }
            }' > data/history_merged.tmp \
          && mv data/history_merged.tmp data/holiday_price_history.jsonl
          git config user.name "holiday-history-bot"
          git config user.email "history@localhost"
          git add data/holiday_price_history.jsonl
          if git diff --cached --quiet; then
            echo "No new observations."
            exit 0
          fi
          git commit -m "history: holiday price observations from public planner $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RETRIES=3
          until git push origin main; do
            RETRIES=$((RETRIES-1))
            if [[ $RETRIES -le 0 ]]; then
              echo "::warning::History commit-back failed after retries."
              exit 1
            fi
            # Rebase onto latest main so a concurrent run's observations
            # are never lost, then retry the push.
            git pull --rebase origin main || true
            sleep 5
          done
